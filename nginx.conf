server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # БЕЗОПАСНОСТЬ: не отдавать служебные файлы наружу (versioned, едет с репо)
  location ~ /\.                 { deny all; }   # .git, .gitignore, любые dotfiles
  location ~* \.(conf|ya?ml|md)$ { deny all; }   # nginx.conf, docker-compose.yml, README/CLAUDE/HANDOFF/VIDEO-PLAN.md

  # ES-модули, HTML и данные — без кеша (чтобы не залипала старая версия)
  location ~* \.(html?|js|mjs|json)$ { add_header Cache-Control "no-cache"; }

  # 3D-модели glTF
  location ~* \.glb$ { default_type model/gltf-binary; expires 7d; add_header Cache-Control "public"; }

  # тяжёлая статика (карта, иллюстрации, шрифты) — кеш
  location ~* \.(png|jpe?g|webp|gif|woff2?|otf|ttf|mp4|webm)$ {
    expires 7d; add_header Cache-Control "public, must-revalidate";
  }

  location / { try_files $uri $uri/ =404; }
}
